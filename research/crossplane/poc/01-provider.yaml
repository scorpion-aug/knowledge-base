# provider-kubernetes installed to run "in-cluster": the provider manages
# objects on the SAME cluster it runs in, using its own ServiceAccount
# (bound to cluster-admin below). No kubeconfig Secret, no cloud credentials.
#
# Note: Provider is cluster-scoped in Crossplane v2.4.3 (core CRD
# providers.pkg.crossplane.io has scope: Cluster), so no metadata.namespace.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.4.1
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-kubernetes
---
# Give the provider pod a dedicated ServiceAccount so we can grant it
# permissions. The provider pod runs in crossplane-system.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
# Grant the provider's ServiceAccount cluster-admin so it can create the
# composed Deployment + Service on this (the same) cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io